name: Apple Stock Alert Bot

on:
  schedule:
    - cron: "13 */2 * * *"   # every 2h at :13 past — off the top-of-hour to avoid GitHub's scheduling congestion; each run loops ~3h50m, so with 3+ overlapping shifts running at once, a single delayed trigger can't create a gap
  workflow_dispatch: {}

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run alert bot
        run: python -u apple_alert_bot.py
        env:
          MODEL_URL: ${{ vars.APPLE_MODEL_URL || 'https://www.apple.com/ae/shop/buy-iphone/iphone-18-pro' }}
          SCREEN_KEYWORD: ${{ vars.APPLE_SCREEN_KEYWORD || '6_9inch' }}
          CAPACITY_KEYWORDS: ${{ vars.APPLE_CAPACITY_KEYWORDS || '256gb,512gb,1tb' }}
          CITIES: ${{ vars.APPLE_CITIES || 'Dubai,Abu Dhabi,Al Ain' }}
          TARGET_DATES: ${{ vars.APPLE_TARGET_DATES || 'today,18,19,20' }}
          TARGET_MONTH: ${{ vars.APPLE_TARGET_MONTH || 'sep' }}
          REST_SECONDS: ${{ vars.APPLE_REST_SECONDS || '30' }}
          POLL_SECONDS: ${{ vars.APPLE_POLL_SECONDS || '120' }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO || secrets.GMAIL_ADDRESS }}

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug-*.png
          if-no-files-found: ignore
